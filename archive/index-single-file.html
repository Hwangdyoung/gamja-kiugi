<title>OO 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout concept: 잡코리아식 구인구직 포털 구조(헤더·검색·메뉴 → 맞춤 카드 2열 → 빠른 선택 → 칩 + 카드 그리드)에
   쥬니어네이버풍 겉모습(해바라기 노랑, 하늘색, 굵은 윤곽선, 둥근 버튼, 말풍선)을 입힌다. 모바일에서는 한 열로 쌓인다. */
:root{
  --bg:#fff6d0; --sky:#a9dcff; --panel:#ffffff; --panel-2:#fff1b0; --line:#f0be2a; --sun:#ffd23f;
  --ink:#2a2d3a; --ink-2:#5b5f70;
  --btn:#1f74c4; --btn-ink:#ffffff; --btn-edge:#124f8c;
  --ok:#2a9a58; --danger:#c43a22;
  --logo-fill:#ffffff; --logo-edge:#2b86d9;
  --m-line:#3a2a10; --m-happy:#ffd23f; --m-neutral:#ffe58a; --m-annoyed:#ffb347; --m-angry:#ff7a59;
  --m-leaf:#3fbf6a; --m-star:#ffe14d; --m-cheek:#ff8fa3; --m-mouth:#8a1c1c; --m-shadow:rgba(0,0,0,.14);
  --f-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15233d; --sky:#243f6b; --panel:#1e2f50; --panel-2:#2b4170; --line:#caa02a;
    --ink:#f3f0e4; --ink-2:#b9c1d5;
    --btn:#5db0f5; --btn-ink:#0e1d33; --btn-edge:#2f7fc2;
    --ok:#5fd08b; --danger:#ff8a70;
    --logo-fill:#ffd23f; --logo-edge:#0b1830; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15233d; --sky:#243f6b; --panel:#1e2f50; --panel-2:#2b4170; --line:#caa02a;
  --ink:#f3f0e4; --ink-2:#b9c1d5;
  --btn:#5db0f5; --btn-ink:#0e1d33; --btn-edge:#2f7fc2;
  --ok:#5fd08b; --danger:#ff8a70;
  --logo-fill:#ffd23f; --logo-edge:#0b1830; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--sky),var(--bg) 420px);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
.shell{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}

/* header */
.top-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 24px;align-items:center;padding-block:16px 6px}
.logo{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.1;text-decoration:none;color:var(--logo-fill);-webkit-text-stroke:7px var(--logo-edge);paint-order:stroke fill;letter-spacing:.02em;text-shadow:0 3px 0 var(--logo-edge);white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;min-width:0;width:100%;max-width:520px;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:4px 6px}
.region{flex:none;font-weight:700;font-size:14px;background:var(--panel-2);border-radius:999px;padding:6px 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:6px 4px}
.search input::placeholder{color:var(--ink-2);opacity:.8}
.search button{flex:none;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:var(--btn);color:var(--btn-ink);cursor:pointer}
.login{font-weight:700;font-size:15px;color:var(--btn);background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:9px 14px;cursor:pointer;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;gap:26px;overflow-x:auto;padding-block:8px 14px}
.menu a{font-family:var(--f-display);font-size:19px;color:var(--ink);text-decoration:none;white-space:nowrap;padding-block:3px;border-bottom:3px solid transparent}
.menu a:hover{border-bottom-color:var(--line)}
@media (max-width:700px){
  .top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo login" "search search"}
  .top-in .logo{grid-area:logo}.top-in .login{grid-area:login}.top-in .search{grid-area:search;max-width:none}
  .logo{font-size:30px}
}

/* panels, buttons, tags */
.panel{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:18px}
.panel.dashed{border-style:dashed;border-radius:18px;padding:14px 16px}
.btn{display:inline-block;font-family:var(--f-display);font-size:18px;line-height:1.2;color:var(--btn-ink);background:var(--btn);border:0;border-bottom:5px solid var(--btn-edge);border-radius:14px;padding:11px 18px;cursor:pointer;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn.sm{font-size:16px;padding:8px 14px;border-bottom-width:4px}
.ghost{font:inherit;font-size:14px;font-weight:700;color:var(--ink-2);background:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tagp{display:inline-block;font-size:12px;font-weight:700;background:var(--panel-2);border:2px solid var(--line);border-radius:999px;padding:0 9px}
.pill{display:inline-block;font-size:12px;color:var(--ink-2);background:var(--panel-2);border-radius:999px;padding:1px 9px}
.err{min-height:1.4em;color:var(--danger);font-weight:700;font-size:13px}
.err:empty{min-height:0}
.warn{font-size:13px;font-weight:700;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.meta{color:var(--ink-2);font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:4px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.kicker{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--btn);font-size:14px}
.intro-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.intro-top p.lead{font-size:18px;font-weight:700;margin:4px 0 12px;text-wrap:balance}
.intro .mascot-wrap{width:118px}
.faux{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;filter:blur(5px);opacity:.8;pointer-events:none;user-select:none}
.faux div{background:var(--panel-2);border-radius:14px;padding:12px;display:grid;gap:8px}
.faux i{display:block;height:10px;border-radius:5px;background:var(--line);opacity:.7}
.faux i:nth-child(2){width:70%}.faux i:nth-child(3){width:40%;background:var(--btn)}
@media (max-width:480px){.faux div:nth-child(3){display:none}.faux{grid-template-columns:repeat(2,minmax(0,1fr))}}

.setup{display:grid;gap:12px}
.setup h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.setup label.t,.setup legend{font-weight:700;font-size:14px;padding:0}
.setup fieldset{border:0;margin:0;padding:0;min-width:0}
.field{width:100%;font-family:var(--f-display);font-size:20px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}
.opt{display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt-body{display:block;height:100%;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:9px 12px}
.opt-body strong{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3}
.opt-body small{color:var(--ink-2);font-size:12px}
.opt input:checked + .opt-body{border-color:var(--btn);background:var(--panel-2);box-shadow:0 0 0 3px var(--btn)}
.opt input:focus-visible + .opt-body{outline:3px solid var(--btn);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.me{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.me{grid-template-columns:1fr}}
.me .mascot-wrap{width:min(170px,70%)}
.me-info{display:grid;gap:8px;justify-items:start}
.who{font-family:var(--f-display);font-size:20px;line-height:1.3}
.prog{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bar{width:100%;height:12px;background:var(--panel-2);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .35s}
.next{color:var(--ink-2);font-size:14px}

.bubble{position:relative;background:var(--panel-2);border:3px solid var(--line);border-radius:18px;padding:9px 12px;font-weight:700;font-size:14px;text-align:center;text-wrap:balance;margin-bottom:20px}
.bubble::before,.bubble::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:10px solid transparent}
.bubble::before{bottom:-23px;border-top-color:var(--line)}
.bubble::after{bottom:-17px;border-top-color:var(--panel-2)}
.me .bubble{min-height:3.4em;display:grid;place-items:center}

.side h2{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.3;text-wrap:balance}
.prefbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:12px;text-align:left;font:inherit;font-weight:500;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
@media (max-width:860px) and (min-width:481px){.quick{gap:12px}}
@media (max-width:480px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qc{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:104px;text-align:left;font:inherit;font-weight:700;font-size:14px;line-height:1.35;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}
.qc svg{align-self:flex-end;width:30px;height:30px;padding:5px;border-radius:50%;background:var(--panel-2);color:var(--btn)}

/* prototype simulator */
.sim{margin-top:16px;border:3px dashed var(--line);border-radius:18px;padding:12px 14px}
.sim-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.sim-tag{font-size:12px;font-weight:700;color:var(--btn-ink);background:var(--btn);border-radius:999px;padding:2px 10px}
.sim label{font-weight:700}
.sim-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 24px;align-items:start;margin-top:6px}
@media (max-width:700px){.sim-body{grid-template-columns:1fr}}
.sim input[type=range]{width:100%;accent-color:var(--btn);margin:6px 0 0}
/* 눈금은 실제 값 위치에 둔다. 좌우 8px은 슬라이더 손잡이 반지름만큼의 여백 */
.sim-scale{position:relative;height:18px;margin:2px 8px 0;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sim-scale span{position:absolute;top:0;transform:translateX(-50%)}
.sim-mood{margin-top:6px;font-size:13px;color:var(--ink-2)}
.notif{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border-radius:16px;padding:10px 12px}
.ni{flex:none;width:36px;height:36px;border-radius:10px;background:var(--m-happy);display:grid;place-items:center}
.nt{min-width:0}
.nt-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.nt-top b{color:var(--ink)}
.nt p{margin-top:2px;font-weight:700;overflow-wrap:anywhere}

/* quick pick */
.pickbar{margin-top:20px;text-align:center;padding:22px 16px}
.pickbar h2{font-family:var(--f-display);font-weight:400;font-size:22px;text-wrap:balance}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;margin-top:14px;max-width:100%;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:transparent;border:0;padding:14px 18px;cursor:pointer;min-width:0}
.seg button + button{border-left:3px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

/* sections */
.sec{margin-top:36px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:26px}
.sec-head p{font-size:13px;color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.chip{flex:none;font:inherit;font-weight:700;font-size:14px;color:var(--ink-2);background:var(--panel-2);border:2px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--btn);background:var(--panel);border-color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.job{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px}
.job-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job h3{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.35;text-wrap:balance}
.job .org{font-size:13px;color:var(--ink-2)}
.job-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.star{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--ink-2);cursor:pointer}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.star[aria-pressed="true"]{color:#e0a000}
.star[aria-pressed="true"] svg{fill:currentColor}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-2);padding:28px 0}
.more{display:block;margin:16px auto 0}

/* 4단계가 3+1로 갈라지지 않게 4열 → 2열 → 1열로만 바뀐다 */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:960px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px}
.step.done{border-color:var(--ok)}
.step-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stepn{font-family:var(--f-display);font-size:16px;color:var(--btn)}
.step h3{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.35;text-wrap:balance}
.step p{font-size:14px}
.step h4{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:4px}
.step ul{margin:0;padding-left:18px;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;font-weight:700;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
.empty-panel{text-align:center;display:grid;gap:12px;justify-items:center;padding:28px 16px}
.senior h3{font-family:var(--f-display);font-weight:400;font-size:18px}
.senior ol{margin:8px 0 0;padding-left:20px}
.senior li{margin:3px 0}
.foot{margin:32px 0 0;padding-bottom:56px;font-size:12px;color:var(--ink-2)}

/* mascot */
.mascot-wrap{margin:0 auto}
.mascot{display:block;width:100%;height:auto;overflow:visible;animation:bob 2.6s ease-in-out infinite}
.mascot[data-mood="angry"]{animation:shake .38s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes puff{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-6px);opacity:.55}}
.m-shadow{fill:var(--m-shadow)}
.m-body{fill:var(--m-happy);stroke:var(--m-line);stroke-width:5;transition:fill .4s}
.mascot[data-mood="neutral"] .m-body{fill:var(--m-neutral)}
.mascot[data-mood="annoyed"] .m-body{fill:var(--m-annoyed)}
.mascot[data-mood="angry"] .m-body{fill:var(--m-angry)}
.m-stem{fill:none;stroke:var(--m-line);stroke-width:5;stroke-linecap:round}
.m-leaf{fill:var(--m-leaf);stroke:var(--m-line);stroke-width:4;stroke-linejoin:round}
.m-star{fill:var(--m-star);stroke:var(--m-line);stroke-width:3;stroke-linejoin:round}
.mascot:not(.lv3):not(.lv4) .leaf-c{display:none}
.mascot:not(.lv4) .m-star{display:none}
.f{display:none}
.mascot[data-mood="happy"] .f-happy,.mascot[data-mood="neutral"] .f-neutral,.mascot[data-mood="annoyed"] .f-annoyed,.mascot[data-mood="angry"] .f-angry{display:block}
.f path{fill:none;stroke:var(--m-line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.f .brow{stroke-width:6}
.f .eye{fill:var(--m-line)}
.f .cheek{fill:var(--m-cheek);opacity:.6}
.f-angry .cheek{opacity:.85;fill:#ff4d4d}
.f .mouth-open{fill:var(--m-mouth)}
.steam{display:none;fill:#fff;stroke:var(--m-line);stroke-width:3}
.mascot[data-mood="angry"] .steam{display:block}
.steam circle{animation:puff 1.2s ease-in-out infinite}
.steam circle:nth-child(2n){animation-delay:.4s}
@media (prefers-reduced-motion: reduce){
  .mascot,.steam circle{animation:none!important}
  .bar i,.m-body{transition:none}
}
</style>

<main id="top">
  <header>
    <div class="shell">
      <div class="top-in">
        <a class="logo" href="#top" data-go="top"><span class="nm">○○</span> 키우기</a>
        <form class="search" id="f-search" role="search">
          <span class="region">춘천 전체</span>
          <input id="q" type="search" placeholder="춘천 기회 검색" aria-label="춘천 기회 검색" autocomplete="off">
          <button type="submit" aria-label="검색"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        </form>
        <button class="login" id="login" type="button">전공·직무 설정</button>
      </div>
      <nav class="menu" aria-label="메뉴">
        <a href="#jobs" data-go="jobs">기회 찾기</a>
        <a href="#path" data-go="path">내 성장 경로</a>
        <a href="#senior" data-go="senior">선배 이야기</a>
      </nav>
    </div>
  </header>

  <div class="shell">
    <section class="hero">
      <div class="panel" id="hero-main">
        <!-- 설정 전 -->
        <div class="intro" id="v-intro">
          <div class="intro-top">
            <div>
              <p class="kicker"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>오늘의 추천</p>
              <p class="lead">내 전공에 맞는 춘천 기회를 찾아드려요!</p>
              <button class="btn sm" type="button" data-open="setup">나만의 맞춤 정보 받기</button>
            </div>
            <div class="mascot-wrap" id="m-intro"></div>
          </div>
          <div class="faux" aria-hidden="true"><div><i></i><i></i><i></i></div><div><i></i><i></i><i></i></div><div><i></i><i></i><i></i></div></div>
        </div>

        <!-- 설정 -->
        <form class="setup" id="setup" autocomplete="off" novalidate hidden>
          <h2>춘천에서 나를 키워볼까요?</h2>
          <div>
            <label class="t" for="name">이름</label>
            <input id="name" class="field" type="text" maxlength="8" placeholder="내 이름">
          </div>

  }
  function renderHero(){
    $('#v-intro').hidden = state.profile || state.editing;
    $('#setup').hidden = !state.editing;
    $('#v-me').hidden = !(state.profile && !state.editing);
    $('#sim').hidden = !state.profile || state.editing;
    if (!state.profile){ setMascot($('#m-intro'), 'happy', 1); return; }
    var mood = moodOf(state.days), msg = messageFor(mood), dc = doneCount(), ni = nextIdx();
    $('#bubble').textContent = msg;
    setMascot($('#m-home'), mood, lvNow());
    $('#who').textContent = state.name + ' · ' + MAJORS[state.major].label + ' ' + track().label;
    $('#prog').textContent = dc + ' / 4단계 완료';
    $('#barfill').style.width = (dc * 25) + '%';
    $('#barwrap').setAttribute('aria-valuenow', dc);
    $('#next').textContent = ni === -1 ? '모든 단계를 마쳤어요.' : '다음은 ' + (ni + 1) + '단계, ' + track().levels[ni].t;
    $('#daysv').textContent = state.days;
    $('#days').value = state.days;
    $('#moodline').textContent = '캐릭터 표정: ' + MOODS[mood];
    $('#notif').textContent = msg;
  }
  function renderSide(){
    $('#side-title').textContent = state.profile ? state.name + '님을 위한 맞춤 정보' : '맞춤 정보를 제공해드릴게요!';
    $('#pref-text').textContent = state.profile ? '전공·직무 바꾸기' : '전공·직무 설정하고 맞춤 기회 받아보기';
    $('#login').textContent = state.profile ? state.name + ' · ' + MAJORS[state.major].label : '전공·직무 설정';
  }
  function renderJobs(){
    var master = buildItems();
    var modeSet = state.mode ? GROUPS[state.mode] : null;
    var base = master.filter(function(it){ return !modeSet || modeSet.indexOf(it.type) !== -1; });
    var types = ['전체'];
    base.forEach(function(it){ if (types.indexOf(it.type) === -1) types.push(it.type); });
    if (types.indexOf(state.type) === -1) state.type = '전체';
    $('#chips').innerHTML = types.map(function(t){ return '<button type="button" class="chip" data-type="' + esc(t) + '" aria-pressed="' + (state.type === t) + '">' + esc(t) + '</button>'; }).join('');
    var q = state.q.trim().toLowerCase();
    var list = base.filter(function(it){
      return (state.type === '전체' || it.type === state.type) && (!q || (it.title + ' ' + it.sub + ' ' + it.type).toLowerCase().indexOf(q) !== -1);
    });
    var shown = list.slice(0, state.visible);
    $('#clearq').hidden = !q;
    $('#jobs-note').textContent = (q ? '"' + state.q.trim() + '" 검색 · ' : '') + (state.profile ?'내 경로(' + MAJORS[state.major].label + ' · ' + track().label + ') 기준 ' + list.length + '건' : '전공·직무를 설정하면 내 경로 기준으로 보여드려요 · ' + list.length + '건');
    $('#grid').innerHTML = shown.length ? shown.map(function(it){
      var on = !!state.stars[it.key];
      return '<article class="job"><div class="job-top"><span class="tagp">' + esc(it.type) + '</span><button type="button" class="star" data-star="' + master.indexOf(it) + '" aria-pressed="' + on + '" aria-label="' + esc(it.title) + ' 스크랩"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button></div><h3>' + esc(it.title) + '</h3><p class="org">' + esc(it.sub) + '</p><div class="job-foot"><span class="pill">춘천</span><span class="pill">예시</span></div></article>';
    }).join('') : '<p class="empty">조건에 맞는 기회가 없어요.</p>';
    var rest = list.length - shown.length;
    $('#more').hidden = rest <= 0;
    $('#more').textContent = '더보기 (' + rest + ')';
    $('#mode-job').setAttribute('aria-pressed', state.mode === 'job');
    $('#mode-exp').setAttribute('aria-pressed', state.mode === 'exp');
    $('#grid')._master = master;
  }
  function renderPath(){
    var box = $('#path-body');
    if (!state.profile){
      $('#path-note').textContent = '';
      box.innerHTML = '<div class="panel empty-panel"><p>전공과 관심 직무를 고르면 졸업까지의 경로가 4단계로 나와요.</p><button class="btn sm" type="button" data-open="setup">나만의 맞춤 정보 받기</button></div>';
      return;
    }
    var T = track();
    $('#path-note').textContent = MAJORS[state.major].label + ' · ' + T.label;
    box.innerHTML = '<ol class="steps">' + T.levels.map(function(L, i){
      var d = state.done[i];
      return '<li class="step' + (d ? ' done' : '') + '"><div class="step-top"><span class="stepn">' + (i + 1) + '단계</span><span class="tagp">' + esc(L.tag) + '</span></div><h3>' + esc(L.t) + '</h3><p>' + esc(L.d) + '</p><h4>이런 기회 (예시)</h4><ul>' + L.o.map(function(x){ return '<li>' + esc(oTitle(x)) + '</li>'; }).join('') + '</ul><label class="chk"><input type="checkbox" data-step="' + i + '"' + (d ? ' checked' : '') + '> 완료했어요</label></li>';
    }).join('') + '</ol>';
  }
  function renderSenior(){
    var box = $('#senior-body');
    var T = track();
    if (!state.profile){ box.innerHTML = '<p class="meta">전공을 설정하면 그 전공 선배의 경로를 보여드려요.</p>'; return; }
    if (T.senior){
      box.innerHTML = '<h3>이 경로를 지난 선배 (예시)</h3><p class="meta">' + esc(MAJORS[state.major].label) + ' 전공 선배 A</p><ol>' + T.senior.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
    } else {
      box.innerHTML = '<h3>이 경로를 지난 선배</h3><p class="meta">선배 인터뷰를 마치면 실제 사례로 채울 자리예요.</p>';
    }
  }
  function renderAll(){ updateLogo(); renderHero(); renderSide(); renderJobs(); renderPath(); renderSenior(); }

  /* ---------- 동작 ---------- */
  function goTo(id){
    var el = document.getElementById(id); if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
  function openSetup(){
    state.editing = true;
    pend.major = state.major; pend.track = state.track;
    $('#name').value = state.name; $('#err').textContent = '';
    $('#save').textContent = state.profile ? '저장하기' : '내 경로 만들기';
    renderSetupOpts(); updateWarn(); renderHero();
    goTo('top');
    setTimeout(function(){ $('#name').focus({ preventScroll: true }); }, 0);
  }
  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]');
    if (g){
      e.preventDefault();
      var id = g.getAttribute('data-go');
      if (id === 'sim'){
        if (!state.profile){ openSetup(); return; }
        // 슬라이더와 캐릭터가 한 화면에 보이도록 캐릭터 카드 맨 위로 이동
        goTo('hero-main'); $('#days').focus({ preventScroll: true }); return;
      }
      goTo(id); return;
    }
    if (e.target.closest('[data-open="setup"]')){ openSetup(); return; }
  });
  $('#login').addEventListener('click', openSetup);
  $('#pref').addEventListener('click', openSetup);
  $('#cancel').addEventListener('click', function(){ state.editing = false; renderAll(); });

  $('#name').addEventListener('input', function(e){ $('#err').textContent = ''; updateLogo(e.target.value.trim()); });
  $('#majors').addEventListener('change', function(e){
    if (e.target.name !== 'major') return;
    pend.major = e.target.value; pend.track = null; $('#err').textContent = '';
    renderSetupOpts(); updateWarn();
    var picked = $('#majors input[value="' + pend.major + '"]'); if (picked) picked.focus();
  });
  $('#tracks').addEventListener('change', function(e){
    if (e.target.name !== 'track') return;
    pend.track = e.target.value; $('#err').textContent = ''; updateWarn();
  });
  $('#setup').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('#name').value.trim();
    if (!v){ $('#err').textContent = '이름을 적어주세요.'; $('#name').focus(); return; }
    if (!pend.major){ $('#err').textContent = '전공을 골라주세요.'; return; }
    if (!pend.track){ $('#err').textContent = '관심 직무를 골라주세요.'; return; }
    var changed = state.major !== pend.major || state.track !== pend.track;
    state.name = v; state.major = pend.major; state.track = pend.track;
    state.profile = true; state.editing = false;
    if (changed){ state.done = [false, false, false, false]; state.days = 0; state.mode = null; state.type = '전체'; state.visible = PAGE; state.q = ''; $('#q').value = ''; }
    renderAll(); goTo('top');
  });

  $('#days').addEventListener('input', function(e){ state.days = +e.target.value; renderHero(); });

  $('#f-search').addEventListener('submit', function(e){ e.preventDefault(); goTo('jobs'); });
  $('#q').addEventListener('input', function(e){ state.q = e.target.value; state.visible = PAGE; renderJobs(); });

  $('#mode-job').addEventListener('click', function(){ state.mode = state.mode === 'job' ? null : 'job'; state.type = '전체'; state.visible = PAGE; renderJobs(); });
  $('#mode-exp').addEventListener('click', function(){ state.mode = state.mode === 'exp' ? null : 'exp'; state.type = '전체'; state.visible = PAGE; renderJobs(); });
  $('#chips').addEventListener('click', function(e){
    var c = e.target.closest('[data-type]'); if (!c) return;
    state.type = c.getAttribute('data-type'); state.visible = PAGE; renderJobs();
  });
  $('#grid').addEventListener('click', function(e){
    var s = e.target.closest('[data-star]'); if (!s) return;
    var it = $('#grid')._master[+s.getAttribute('data-star')];
    if (!it) return;
    state.stars[it.key] = !state.stars[it.key];
    s.setAttribute('aria-pressed', !!state.stars[it.key]);
  });
  $('#clearq').addEventListener('click', function(){ state.q = ''; $('#q').value = ''; state.visible = PAGE; renderJobs(); });
  $('#more').addEventListener('click', function(){ state.visible += PAGE; renderJobs(); });
  $('#path-body').addEventListener('change', function(e){
    var c = e.target.closest('[data-step]'); if (!c) return;
    state.done[+c.getAttribute('data-step')] = c.checked;
    renderHero(); renderPath();
    var again = $('[data-step="' + c.getAttribute('data-step') + '"]'); if (again) again.focus();
  });

  renderAll();
})();
</script>
